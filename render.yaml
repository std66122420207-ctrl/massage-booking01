services:
  - type: web
    name: massage-booking
    runtime: node
    rootDir: .
    buildCommand: npm install --prefix server
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: '*'
      - key: APP_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: THAID_CLIENT_ID
        sync: false
      - key: THAID_CLIENT_SECRET
        sync: false
      - key: THAID_REDIRECT_URI
        sync: false
      - key: THAID_API_BASE
        value: https://imauth.bora.dopa.go.th
      - key: THAID_SCOPE
        value: openid pid name given_name family_name birthdate
      - key: THAID_TOKEN_AUTH
        value: basic
      - key: MOCK_THAID
        value: 'false'
      - key: GOOGLE_SHEETS_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_SHEETS_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
