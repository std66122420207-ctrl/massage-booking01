name: massage_booking
description: ระบบจองคิวนวดแผนไทย - ศูนย์สุขภาพชุมชนท่าวังหิน
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_messaging: ^15.0.3   # Push notification

  # HTTP
  http: ^1.2.1
  dio: ^5.4.3

  # State Management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  table_calendar: ^3.1.2         # ปฏิทินจองคิว
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  flutter_secure_storage: ^9.2.2 # เก็บ token อย่างปลอดภัย

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpeg
